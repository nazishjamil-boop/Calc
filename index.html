<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Simple Calculator</h1>
        <div class="calculator">
            <input type="number" id="num1" placeholder="Enter first number" class="input-field">
            <input type="number" id="num2" placeholder="Enter second number" class="input-field">
            
            <div class="button-group">
                <button onclick="add()" class="btn btn-add">Add</button>
                <button onclick="subtract()" class="btn btn-subtract">Subtract</button>
                <button onclick="divide()" class="btn btn-divide">Divide</button>
            </div>
            
            <div class="result-display">
                <p>Result: <span id="result">0</span></p>
            </div>
            
            <button onclick="clearFields()" class="btn btn-clear">Clear</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
